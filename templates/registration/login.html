{% extends 'home.html' %}

{% block content %}
<div class="max-w-md mx-auto mt-16 mb-24">
    <div class="bg-white p-10 md:p-12 rounded-[2.5rem] shadow-2xl border border-orange-50 relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-2 bg-tarimba"></div>
        
        <div class="text-center mb-10">
            <div class="inline-flex items-center justify-center w-20 h-20 bg-orange-50 rounded-3xl text-4xl mb-6 shadow-inner">
                <span class="animate-pulse">🔑</span>
            </div>
            <h2 class="text-3xl font-black text-gray-900 tracking-tighter uppercase">Aceder ao Portal</h2>
            <p class="text-gray-400 text-sm mt-2 font-medium">Insira as suas credenciais de acesso do Tarimba.</p>
        </div>

        <form method="POST" action="{% url 'login' %}" class="space-y-6">
            {% csrf_token %}
            <div>
                <label class="block text-[10px] font-black text-gray-400 uppercase tracking-[0.2em] mb-2 ml-1">Utilizador (Nº do B.I.)</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-gray-400">
                        <i class="fas fa-id-card"></i>
                    </span>
                    <input type="text" name="username" required
                        class="w-full pl-11 pr-4 py-4 bg-gray-50 border-2 border-gray-50 rounded-2xl focus:border-tarimba focus:bg-white outline-none transition font-bold text-gray-700" 
                        placeholder="000000000LA000">
                </div>
            </div>

            <div>
                <label class="block text-[10px] font-black text-gray-400 uppercase tracking-[0.2em] mb-2 ml-1">Palavra-passe</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-gray-400">
                        <i class="fas fa-lock"></i>
                    </span>
                    <input type="password" name="password" required
                        class="w-full pl-11 pr-4 py-4 bg-gray-50 border-2 border-gray-50 rounded-2xl focus:border-tarimba focus:bg-white outline-none transition font-bold text-gray-700"
                        placeholder="••••••••">
                </div>
            </div>

            <button type="submit" class="w-full bg-tarimba text-white py-5 rounded-2xl font-black text-sm uppercase tracking-widest hover:bg-orange-600 transition shadow-xl shadow-orange-100 hover:-translate-y-1">
                Entrar no Sistema
            </button>
        </form>

        <div class="mt-10 text-center">
            <p class="text-xs text-gray-400 font-medium">Esqueceu a senha? Contacte a <a href="mailto:tresgrupo159@gmail.com" class="text-tarimba font-bold">Secretaria</a>.</p>
        </div>
    </div>
</div>
{% endblock %}
